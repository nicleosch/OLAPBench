title: Umbra dictionary encodings — Dict / FSST / OnPair (ClickBench + Prod-DS)
repetitions: 5
warmup: 1
timeout: 300
fetch_result: false
output: results/umbra_encodings/

# Three string-dictionary ENCODINGS (not block codecs), selected via the global
# setting relation.column.compression (umbra_env -> RELATION_COLUMN_COMPRESSION,
# read by a WITH-less CREATE TABLE at load):
#   Dict   = None    (plain dictionary, the in-memory baseline)
#   FSST   = FSST     (FSST-compressed dictionary payload)
#   OnPair = OnPair   (OnPair-compressed dictionary payload)
# Each system uses a distinct umbra_db so the per-encoding databases don't collide.
#
# Memory (122 GiB box): buffer pool (buffer_size -> BUFFERSIZE) kept modest since it
# is only a disk-page cache during load; query buffer (database.querymemorysize ->
# DATABASE_QUERYMEMORYSIZE, default 40% RAM) raised so the FSST/OnPair dictionary
# build over 100M rows fits. Sum 24+80 = 104 GiB, ~18 GiB headroom.
#
# Set the two paths once (joined onto OLAPBench's cwd; absolute is fine):
#   umbra_src : your Umbra checkout
#   bin       : dir containing the built `sql` binary (server: cmake-build-relwithdebinfo)

systems:
  - title: umbra-dict
    dbms: umbradev
    parameter: {version: HEAD, umbra_src: /home/schmitt/git/umbra, bin: /home/schmitt/git/umbra/cmake-build-relwithdebinfo, umbra_db: umbra_dict, buffer_size: "48G"}
    settings: {relation.column.compression: None, database.querymemorysize: 56G}
  - title: umbra-fsst
    dbms: umbradev
    parameter: {version: HEAD, umbra_src: /home/schmitt/git/umbra, bin: /home/schmitt/git/umbra/cmake-build-relwithdebinfo, umbra_db: umbra_fsst, buffer_size: "48G"}
    settings: {relation.column.compression: FSST, database.querymemorysize: 56G}
  - title: umbra-onpair
    dbms: umbradev
    parameter: {version: HEAD, umbra_src: /home/schmitt/git/umbra, bin: /home/schmitt/git/umbra/cmake-build-relwithdebinfo, umbra_db: umbra_onpair, buffer_size: "48G"}
    settings: {relation.column.compression: OnPair, database.querymemorysize: 56G}

benchmarks:
  - name: clickbench
  - name: prodds
    scale: 100
    str_level: 15
    null_profile: none
    mcv_profile: none
    dialect: postgres
